<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>X Dental Store</title>
    <meta name="description" content="Shop dental instruments, clinic essentials, equipment, and trusted dental brands from X Dental Store in Egypt." />
    <meta name="keywords"    content="dental supplies, dental instruments, endodontics, dental burs, composite, bonding, clinic essentials, X Dental Store" />
    <meta name="robots"      content="index, follow" />
    <link rel="canonical"    href="https://xdentalstore.com/" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://xdentalstore.com/" />
    <meta property="og:title"       content="X Dental Store — Premium Dental Supplies" />
    <meta property="og:description" content="Shop dental instruments, clinic essentials, equipment, and trusted dental brands from X Dental Store in Egypt." />
    <meta property="og:image"       content="https://xdentalstore.com/favicon.webp" />

    <!-- Twitter -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@xdentalstore" />
    <meta name="twitter:title"       content="X Dental Store — Premium Dental Supplies" />
    <meta name="twitter:description" content="Shop dental instruments, clinic essentials, equipment, and trusted dental brands from X Dental Store in Egypt." />
    <meta name="twitter:image"       content="https://xdentalstore.com/favicon.webp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://xdentalstore.com/#organization",
            "name": "X Dental Store",
            "url": "https://xdentalstore.com/"
          },
          {
            "@type": "WebSite",
            "@id": "https://xdentalstore.com/#website",
            "name": "X Dental Store",
            "url": "https://xdentalstore.com/",
            "publisher": { "@id": "https://xdentalstore.com/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://xdentalstore.com/products?search={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts: preconnect first, then load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved/system theme before React paints. -->
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("xdental.theme");
          var theme = storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>

    <!-- Theme color (mobile browser chrome) -->
    <meta name="theme-color" content="#F8F7F2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

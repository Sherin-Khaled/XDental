kind = "web"
previewPath = "/"
title = "X Dental Store"
version = "1.0.0"
id = "artifacts/x-dental-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22918

[services.development]
run = "pnpm --filter @workspace/x-dental-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/x-dental-store", "run", "build" ]
publicDir = "artifacts/x-dental-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22918"
BASE_PATH = "/"
